<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sham Vinicius Fiorin — Backend Software Engineer</title>
  <desc id="desc">Dark blue banner with an abstract distributed systems diagram and a concise professional introduction.</desc>

  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="1140" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#0D2730"/>
    </linearGradient>
    <linearGradient id="accent" x1="112" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 170) rotate(132) scale(292 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .signal { stroke-dasharray: 8 12; animation: flow 5s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
      .pulse.delay-1 { animation-delay: .7s; }
      .pulse.delay-2 { animation-delay: 1.4s; }
      .prompt { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes flow { to { stroke-dashoffset: -100; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes blink { 50% { opacity: .15; } }
      @media (prefers-reduced-motion: reduce) { .signal, .pulse, .prompt { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#5EEAD4" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="1040" cy="150" r="300" fill="url(#glow)"/>

  <g opacity="0.7">
    <path class="signal" d="M842 87H946L1000 141H1095" stroke="#5EEAD4" stroke-width="2"/>
    <path class="signal" d="M812 177H915L966 228H1122" stroke="#38BDF8" stroke-width="2"/>
    <path class="signal" d="M875 286H956L1024 218V108H1115" stroke="#5EEAD4" stroke-width="2"/>
    <circle class="pulse" cx="842" cy="87" r="7" fill="#5EEAD4" filter="url(#softGlow)"/>
    <circle class="pulse delay-1" cx="812" cy="177" r="7" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle class="pulse delay-2" cx="875" cy="286" r="7" fill="#5EEAD4" filter="url(#softGlow)"/>
    <rect x="1089" y="127" width="54" height="28" rx="8" fill="#0B1B2B" stroke="#5EEAD4"/>
    <text x="1116" y="146" fill="#CCFBF1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">API</text>
    <rect x="1095" y="214" width="54" height="28" rx="8" fill="#0B1B2B" stroke="#38BDF8"/>
    <text x="1122" y="233" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">DATA</text>
    <rect x="1089" y="94" width="54" height="28" rx="8" fill="#0B1B2B" stroke="#5EEAD4"/>
    <text x="1116" y="113" fill="#CCFBF1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">EVENT</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="84" y="92" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2">HELLO, I BUILD THE BACKEND</text>
    <text x="80" y="180" fill="#F8FAFC" font-size="58" font-weight="750" letter-spacing="-2">Sham Vinicius Fiorin</text>
    <rect x="82" y="205" width="530" height="4" rx="2" fill="url(#accent)"/>
    <text x="82" y="255" fill="#CBD5E1" font-size="25" font-weight="500">Backend Software Engineer · Java · Spring</text>
    <text x="82" y="303" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">systems / integrations / production</text>
    <rect class="prompt" x="472" y="287" width="10" height="20" rx="1" fill="#5EEAD4"/>
  </g>
</svg>
